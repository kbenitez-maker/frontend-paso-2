sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/.next/**,\
  **/tests/**,\
  **/playwright/**,\
  **/types/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/*.css,\
  **/*.mdx,\
  **/*.config.ts,\
  **/*.config.js,\
  src/instrumentation.ts,\
  src/i18n/request.ts,\
  contracts/**,\
  src/contracts/generated/**,\
  test/fixtures/generated/**
sonar.testExecutionReportPaths=coverage/sonar-report.xml
sonar.exclusions=\
  contracts/**,\
  src/contracts/generated/**,\
  test/fixtures/generated/**
# The pipeline template may override sonar.exclusions, so duplication and
# issues on generated code and local tooling are also excluded explicitly.
sonar.cpd.exclusions=\
  contracts/**,\
  src/contracts/generated/**,\
  test/fixtures/generated/**
sonar.issue.ignore.multicriteria=tooling,generated,fixtures
sonar.issue.ignore.multicriteria.tooling.ruleKey=*
sonar.issue.ignore.multicriteria.tooling.resourceKey=contracts/**
sonar.issue.ignore.multicriteria.generated.ruleKey=*
sonar.issue.ignore.multicriteria.generated.resourceKey=src/contracts/generated/**
sonar.issue.ignore.multicriteria.fixtures.ruleKey=*
sonar.issue.ignore.multicriteria.fixtures.resourceKey=test/fixtures/generated/**
